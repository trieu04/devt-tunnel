name: Set up desktop build
description: Install Go, the frontend toolchain, native GUI libraries, and Wails.

inputs:
  nsis:
    description: Install NSIS on Windows so the installer can be built.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: ./.github/actions/setup-frontend
    - name: Install Linux GUI libraries
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev rpm xvfb
    - name: Install NSIS
      if: runner.os == 'Windows' && inputs.nsis == 'true'
      shell: pwsh
      run: |
        choco install nsis -y --no-progress
        "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    # Keep in step with the wails/v3 version in go.mod. The module's go.sum does
    # not cover the CLI's dependencies, so an unversioned install does not work.
    - name: Install Wails CLI
      shell: bash
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
