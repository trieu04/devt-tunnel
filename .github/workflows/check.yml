name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Core and platform code must build and pass without GUI libraries.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      PACKAGES: >-
        ./internal/core/... ./internal/api/... ./internal/engine/...
        ./internal/control/... ./internal/client/... ./internal/daemon/...
        ./internal/mcpserver/... ./internal/askpass/... ./internal/platform/...
        ./internal/e2e/... ./internal/cli/... ./cmd/... ./docs/...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet $PACKAGES
      - run: go test -count=1 $PACKAGES
      - name: Regenerate CLI reference without drift
        if: runner.os == 'Linux'
        run: |
          go run ./internal/cli/gen
          git diff --exit-code -- docs/cli
          test -z "$(git ls-files --others --exclude-standard docs/cli)"
      - name: Cross-build headless daemon
        if: runner.os == 'Linux'
        run: |
          for goos in linux windows darwin; do
            GOOS=$goos go build -o /dev/null ./cmd/devt-tunnel
          done

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm format:check
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  app:
    needs: [core, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-desktop
      - name: Test GUI host
        run: go test -count=1 ./internal/host/...
      - run: wails3 task build
      - name: Smoke built app on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          smoke_dir=$(mktemp -d)
          export DEVT_TUNNEL_CONFIG_DIR="$smoke_dir/config"
          export DEVT_TUNNEL_STATE_DIR="$smoke_dir/state"
          log="$DEVT_TUNNEL_STATE_DIR/devt-tunnel.log"
          launcher=()
          if [ "${RUNNER_OS}" = "Linux" ]; then launcher=(xvfb-run -a); fi
          "${launcher[@]}" ./bin/devt-tunnel-desktop >"$smoke_dir/app.out" 2>&1 &
          app_pid=$!
          ready=false
          for attempt in $(seq 1 45); do
            if grep -q "application ready" "$log" 2>/dev/null; then ready=true; break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then echo "app exited early"; break; fi
            sleep 1
          done
          kill "$app_pid" 2>/dev/null || true
          if [ "$ready" != true ]; then
            echo "::group::app stdout/stderr"; cat "$smoke_dir/app.out" || true; echo "::endgroup::"
            echo "::group::devt-tunnel.log"; cat "$log" || echo "no log file"; echo "::endgroup::"
            exit 1
          fi
      - name: Smoke built app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "devt-tunnel-smoke"
          $env:DEVT_TUNNEL_CONFIG_DIR = Join-Path $root "config"
          $env:DEVT_TUNNEL_STATE_DIR = Join-Path $root "state"
          $logFile = Join-Path $env:DEVT_TUNNEL_STATE_DIR "devt-tunnel.log"
          function Test-Ready { (Test-Path $logFile) -and (Select-String -Quiet -Pattern "application ready" $logFile) }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $process = Start-Process -FilePath ".\bin\devt-tunnel-desktop.exe" -PassThru -RedirectStandardOutput "$root\app.out" -RedirectStandardError "$root\app.err"
          for ($i = 0; $i -lt 45 -and -not (Test-Ready); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Ready)) {
            Write-Host "process exited: $($process.HasExited)"
            if ($process.HasExited) { Write-Host "exit code: $($process.ExitCode)" }
            Write-Host "::group::app stdout/stderr"
            Get-Content "$root\app.out", "$root\app.err" -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            Get-ChildItem -Recurse $root -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "$($_.FullName) $($_.Length)" }
            if (Test-Path $logFile) { Get-Content $logFile } else { Write-Host "no log file" }
            throw "health line not found"
          }
          Stop-Process -Id $process.Id -Force
