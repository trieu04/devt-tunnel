name: Build Desktop

# Unsigned desktop packages for testing. Signed/notarized release builds
# stay in release.yml.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, macos, windows, linux]

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          matrix=$(jq -c --arg p "$PLATFORM" '{include: map(select($p == "all" or .target == $p))}' <<'JSON'
          [
            {"target": "macos", "arch": "arm64", "os": "macos-15"},
            {"target": "macos", "arch": "amd64", "os": "macos-15-intel"},
            {"target": "windows", "arch": "amd64", "os": "windows-latest"},
            {"target": "linux", "arch": "amd64", "os": "ubuntu-24.04"}
          ]
          JSON
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.target }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-desktop
        with:
          nsis: true

      - name: Package macOS
        if: matrix.target == 'macos'
        shell: bash
        run: |
          wails3 task darwin:package ARCH=${{ matrix.arch }}
          ditto -c -k --keepParent bin/devt-tunnel-desktop.app "bin/devt-tunnel-desktop-${{ matrix.arch }}-unsigned.app.zip"
          wails3 task darwin:create:dmg
          mv bin/devt-tunnel-desktop.dmg "bin/devt-tunnel-desktop-${{ matrix.arch }}-unsigned.dmg"
      - name: Package Windows
        if: matrix.target == 'windows'
        run: |
          wails3 task windows:build ARCH=${{ matrix.arch }}
          wails3 task windows:create:nsis:installer:from-build ARCH=${{ matrix.arch }}
      - name: Package Linux
        if: matrix.target == 'linux'
        run: wails3 task linux:package ARCH=${{ matrix.arch }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find bin build/windows/nsis -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*installer.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} out/ \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
