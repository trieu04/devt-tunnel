name: Build CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version string embedded in the binary (default derives from build/config.yml)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: devt-tunnel ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION=${VERSION:-$(awk '/^  version:/ {gsub(/"/, "", $2); print $2}' build/config.yml)}
          name="devt-tunnel_${VERSION}_${GOOS}_${GOARCH}"
          bin=devt-tunnel; [ "$GOOS" = windows ] && bin=devt-tunnel.exe
          mkdir dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${bin}" ./cmd/devt-tunnel
          cd dist
          if [ "$GOOS" = windows ]; then
            zip "${name}.zip" "$bin"
          else
            tar -czf "${name}.tar.gz" "$bin"
          fi
          rm "$bin"
          sha256sum * > "${name}.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devt-tunnel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
