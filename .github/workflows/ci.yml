name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # Core and platform code must build and pass without GUI libraries.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/core/... ./internal/askpass/... ./internal/platform/... ./internal/e2e/... ./cmd/...
      - run: go test -count=1 ./internal/core/... ./internal/askpass/... ./internal/platform/... ./internal/e2e/... ./cmd/...

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: wails3 task build
