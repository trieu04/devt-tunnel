name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin
            arch: arm64
          - os: macos-15-intel
            target: darwin
            arch: amd64
          - os: windows-latest
            target: windows
            arch: amd64
          - os: ubuntu-24.04
            target: linux
            arch: amd64
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Verify tag version
        shell: bash
        run: |
          config_version=$(awk '/^  version:/ {gsub(/"/, "", $2); print $2}' build/config.yml)
          test "v${config_version}" = "$GITHUB_REF_NAME"
      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@12 --activate
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev rpm
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Test
        shell: bash
        run: |
          go test ./internal/... ./cmd/...
          CGO_ENABLED=0 go test ./internal/core/... ./internal/api/... ./internal/engine/... ./internal/control/... ./internal/client/... ./internal/daemon/... ./internal/askpass/... ./internal/platform/... ./internal/e2e/... ./cmd/...
          pnpm --dir frontend test
      - name: Package macOS
        if: matrix.target == 'darwin'
        run: wails3 task darwin:package ARCH=${{ matrix.arch }}
      - name: Sign and notarize macOS
        if: matrix.target == 'darwin' && env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_API_KEY_BASE64 != ''
        shell: bash
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > signing.p12
          security create-keychain -p build release.keychain
          security import signing.p12 -k release.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s release.keychain
          security unlock-keychain -p build release.keychain
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "bin/devt-tunnel-desktop.app/Contents/MacOS/devt-tunnel-askpass"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "bin/devt-tunnel-desktop.app/Contents/MacOS/devt-tunnel"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "bin/devt-tunnel-desktop.app"
          codesign --verify --strict "bin/devt-tunnel-desktop.app"
      - name: Create macOS archives
        if: matrix.target == 'darwin'
        shell: bash
        run: |
          ditto -c -k --keepParent bin/devt-tunnel-desktop.app "bin/devt-tunnel-desktop-${{ matrix.arch }}.app.zip"
          wails3 task darwin:create:dmg
          mv bin/devt-tunnel-desktop.dmg "bin/devt-tunnel-desktop-${{ matrix.arch }}.dmg"
      - name: Notarize macOS image
        if: matrix.target == 'darwin' && env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_API_KEY_BASE64 != ''
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > AuthKey.p8
          xcrun notarytool submit bin/*.dmg --key AuthKey.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple bin/*.dmg
      - name: Package Windows
        if: matrix.target == 'windows'
        run: wails3 task windows:build ARCH=${{ matrix.arch }}
      - name: Sign Windows binaries
        if: matrix.target == 'windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          wails3 tool sign --input "bin/devt-tunnel-desktop.exe" --certificate "signing.pfx" --password "$env:WINDOWS_CERTIFICATE_PASSWORD"
          wails3 tool sign --input "bin/devt-tunnel-askpass.exe" --certificate "signing.pfx" --password "$env:WINDOWS_CERTIFICATE_PASSWORD"
      - name: Create Windows installer
        if: matrix.target == 'windows'
        run: wails3 task windows:create:nsis:installer:from-build ARCH=${{ matrix.arch }}
      - name: Sign Windows installer
        if: matrix.target == 'windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: wails3 tool sign --input "build/windows/nsis/devt-tunnel-desktop-installer.exe" --certificate "signing.pfx" --password "$env:WINDOWS_CERTIFICATE_PASSWORD"
      - name: Package Linux
        if: matrix.target == 'linux'
        run: wails3 task linux:package ARCH=${{ matrix.arch }}
      - name: Mark unsigned artifacts
        if: (matrix.target == 'darwin' && (env.APPLE_CERTIFICATE_BASE64 == '' || env.APPLE_API_KEY_BASE64 == '')) || (matrix.target == 'windows' && env.WINDOWS_CERTIFICATE_BASE64 == '')
        shell: bash
        run: |
          for file in bin/*.dmg bin/*.app.zip build/windows/nsis/*-installer.exe; do
            test -e "$file" || continue
            mv "$file" "${file%.*}-unsigned.${file##*.}"
          done
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          find bin build/windows/nsis -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*installer.exe' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release/ \;
          cd release
          shasum -a 256 * > SHA256SUMS-${{ matrix.target }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444306234b4f18a22b3d1e57 # v4.1.8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes --title "$GITHUB_REF_NAME"
