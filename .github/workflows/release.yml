name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag version
        run: |
          config_version=$(awk '/^  version:/ {gsub(/"/, "", $2); print $2}' build/config.yml)
          test "v${config_version}" = "$GITHUB_REF_NAME"

  check:
    needs: verify-tag
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin
            arch: arm64
          - os: macos-15-intel
            target: darwin
            arch: amd64
          - os: windows-latest
            target: windows
            arch: amd64
          - os: ubuntu-24.04
            target: linux
            arch: amd64
    runs-on: ${{ matrix.os }}
    env:
      # Only this flag is job-wide; each signing step gets just the secrets it uses.
      SIGNED: ${{ (matrix.target == 'darwin' && secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_API_KEY_BASE64 != '') || (matrix.target == 'windows' && secrets.WINDOWS_CERTIFICATE_BASE64 != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
        with:
          nsis: true
      - name: Package macOS
        if: matrix.target == 'darwin'
        run: wails3 task darwin:package ARCH=${{ matrix.arch }}
      - name: Sign macOS app
        if: matrix.target == 'darwin' && env.SIGNED == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > signing.p12
          security create-keychain -p build release.keychain
          security import signing.p12 -k release.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build release.keychain
          security list-keychains -d user -s release.keychain
          security unlock-keychain -p build release.keychain
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "bin/devt-tunnel-desktop.app/Contents/MacOS/devt-tunnel-askpass"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "bin/devt-tunnel-desktop.app/Contents/MacOS/devt-tunnel"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "bin/devt-tunnel-desktop.app"
          codesign --verify --strict "bin/devt-tunnel-desktop.app"
      - name: Create macOS archives
        if: matrix.target == 'darwin'
        shell: bash
        run: |
          ditto -c -k --keepParent bin/devt-tunnel-desktop.app "bin/devt-tunnel-desktop-${{ matrix.arch }}.app.zip"
          wails3 task darwin:create:dmg
          mv bin/devt-tunnel-desktop.dmg "bin/devt-tunnel-desktop-${{ matrix.arch }}.dmg"
      - name: Notarize macOS image
        if: matrix.target == 'darwin' && env.SIGNED == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > AuthKey.p8
          xcrun notarytool submit bin/*.dmg --key AuthKey.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple bin/*.dmg
      - name: Package Windows
        if: matrix.target == 'windows'
        run: wails3 task windows:build ARCH=${{ matrix.arch }}
      - name: Sign Windows binaries
        if: matrix.target == 'windows' && env.SIGNED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          foreach ($name in "devt-tunnel-desktop", "devt-tunnel-askpass", "devt-tunnel") {
            wails3 tool sign --input "bin/$name.exe" --certificate "signing.pfx" --password "$env:WINDOWS_CERTIFICATE_PASSWORD"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Create Windows installer
        if: matrix.target == 'windows'
        run: wails3 task windows:create:nsis:installer:from-build ARCH=${{ matrix.arch }}
      - name: Sign Windows installer
        if: matrix.target == 'windows' && env.SIGNED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: wails3 tool sign --input "build/windows/nsis/devt-tunnel-desktop-installer.exe" --certificate "signing.pfx" --password "$env:WINDOWS_CERTIFICATE_PASSWORD"
      - name: Package Linux
        if: matrix.target == 'linux'
        run: wails3 task linux:package ARCH=${{ matrix.arch }}
      - name: Mark unsigned artifacts
        if: matrix.target != 'linux' && env.SIGNED != 'true'
        shell: bash
        run: |
          for file in bin/*.dmg bin/*.app.zip build/windows/nsis/*-installer.exe; do
            test -e "$file" || continue
            mv "$file" "${file%.*}-unsigned.${file##*.}"
          done
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          find bin build/windows/nsis -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*installer.exe' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release/ \;
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS-${{ matrix.target }}-${{ matrix.arch }}
          else
            shasum -a 256 * > SHA256SUMS-${{ matrix.target }}-${{ matrix.arch }}
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create draft release, or add assets to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
